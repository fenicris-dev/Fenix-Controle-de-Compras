<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#041273">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Fênix | Controle de Compras</title>
<style>
:root{--navy:#041273;--navy2:#0a1f9e;--gold:#d4a62a;--gold2:#f0c850;--bg:#f3f4fa;--card:#fff;--tx:#1b1d2b;--mut:#6b6f85;--red:#c62828;--green:#1b8a4b;--line:#e1e3ee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overscroll-behavior:none}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(70px + env(safe-area-inset-bottom))}
header{background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:17px;margin:0}header h1 span{color:var(--gold2)}header small{opacity:.8;font-size:12px}
main{padding:12px;max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:60;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:7px 1px;font-size:10.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button b{font-size:19px;font-weight:400}nav button.on{color:var(--navy);font-weight:700}
nav button i{position:absolute;top:3px;right:50%;margin-right:-18px;background:var(--red);color:#fff;font-style:normal;font-size:10px;border-radius:9px;padding:0 5px;min-width:16px;text-align:center}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(4,18,115,.08)}
.card.tap{cursor:pointer}.center{text-align:center}
h2{font-size:17px;margin:0 0 8px}h3{font-size:15px;margin:14px 0 6px;color:var(--navy)}
.hint{color:var(--mut);font-size:12.5px;margin:4px 0}
.btn{border:0;border-radius:10px;padding:11px 14px;font-size:15px;background:var(--navy);color:#fff;margin:4px 0;width:100%;font-weight:600}
.btn.gold{background:var(--gold);color:#1b1500}.btn.ghost{background:#e8eafb;color:var(--navy)}.btn.danger{background:var(--red)}
.btn.big{padding:15px;font-size:17px}.btn.sm{padding:8px 10px;font-size:13px;margin:2px 0}.btn.inl{width:auto}
.row{display:flex;gap:8px}.row>*{flex:1}
label{display:block;font-size:12.5px;color:var(--mut);margin:8px 0 0}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;font-size:16px;background:#fff;color:var(--tx);margin-top:3px;font-family:inherit}
input[type=checkbox]{width:auto;margin-right:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tot{display:flex;justify-content:space-between;align-items:baseline}.tot b{font-size:26px;color:var(--navy)}
.lim{height:10px;background:#e8eafb;border-radius:6px;overflow:hidden;margin-top:6px}.lim i{display:block;height:100%;background:var(--green)}
.lim.over i{background:var(--red)}.over-t{color:var(--red);font-weight:700}
.tms{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.tm{background:#fff;border-radius:12px;padding:10px;border:2px solid transparent;text-align:center}.tm.on{border-color:var(--gold);background:#fff9e5}
.tn{font-size:12px;color:var(--mut);min-height:30px}.tt{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--navy)}
.it{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.it:last-child{border:0}
.it .nm{flex:1;min-width:0}.it .nm b{display:block;font-size:14.5px;overflow-wrap:anywhere}.it .nm small{color:var(--mut)}
.it .vl{font-weight:700;white-space:nowrap}
.ic{border:0;background:#e8eafb;color:var(--navy);border-radius:8px;width:34px;height:34px;font-size:16px;font-weight:700;flex:0 0 auto}
.ic.r{background:#fde7e7;color:var(--red)}.ic.g{background:#e3f5ea;color:var(--green)}
.badge{display:inline-block;background:var(--gold2);color:#4a3600;border-radius:6px;font-size:11px;padding:1px 6px;margin-left:4px;font-weight:700}
.badge.b2{background:#e8eafb;color:var(--navy)}
.bar{display:grid;grid-template-columns:52px 1fr 54px;gap:6px;align-items:center;font-size:13px;margin:4px 0}
.bar i{display:block;height:14px;background:var(--navy);border-radius:5px;min-width:2px}.bar b{text-align:right;font-weight:600}
.bar.w{grid-template-columns:110px 1fr 84px}
.ov{position:fixed;inset:0;background:rgba(10,15,40,.55);display:flex;align-items:flex-end;justify-content:center;overscroll-behavior:contain}
.md{background:#fff;width:100%;max-width:640px;max-height:93vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.mh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.mh b{font-size:16px;color:var(--navy)}.x{border:0;background:#eceefb;border-radius:50%;width:36px;height:36px;font-size:17px;color:var(--navy)}
.mb{padding:12px 14px calc(18px + env(safe-area-inset-bottom));overflow:auto;overscroll-behavior:contain}
.scanbox{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:4/3}
.scanbox video{width:100%;height:100%;object-fit:cover}
.mira{position:absolute;inset:18% 12%;border:3px solid var(--gold2);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:5000;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}.kv span:first-child{color:var(--mut)}.kv span:last-child{text-align:right;overflow-wrap:anywhere}
ul.chg{padding-left:18px;margin:4px 0}
.login{max-width:380px;margin:30px auto}.login h2{text-align:center;color:var(--navy)}
.err{color:var(--red);font-size:13px;min-height:18px;margin:6px 0}
.link{background:none;border:0;color:var(--navy);text-decoration:underline;font-size:14px;padding:6px;width:100%}
.lk{background:none;border:0;color:var(--navy);text-decoration:underline;font-size:12px;padding:6px 0 0;width:100%}
textarea{resize:vertical}
</style>
</head>
<body>
<header><h1>Fênix <span>|</span> Controle de Compras</h1><small id="ver"></small></header>
<main id="main"><div class="empty">Carregando…</div></main>
<nav id="nav" style="display:none"></nav>
<div id="toast"></div>
<script type="module">
'use strict';
const VERSAO='2.1';
const NOME_APP='fenix-compras';
const CORE_URL='https://fenicris-dev.github.io/Fenix-Core/fenix-core.js';
const CHAVE_V1='fenixControleCompras';
const CHANGELOG=[
{v:'2.1',d:'18/10/2026',i:[
 'Grandezas dos produtos: cada item é lançado "por embalagem" (quantidade de embalagens + conteúdo de cada uma: 400 g, 1 L, 30 un…) ou "por peso / volume" (balança: peso comprado, preço do quilo/litro e total).',
 'Preço comparável: o app mostra o preço por kg, por litro, por unidade ou por metro de cada item e do histórico do produto.',
 'Produtos sem código de barras passam a diferenciar o tamanho da embalagem (leite em pó 200 g e 800 g são produtos distintos).',
 'Cronômetros ajustáveis: "✎ ajustar horários" corrige início e fim, adiciona trechos esquecidos ou apaga trechos.',
 'CNPJ da nota preenche Razão Social, nome fantasia e endereço do estabelecimento (padrão do fenix-core v2.4), com cache para não consultar de novo.',
 'Botão "Consultar na SEFAZ": abre a página da nota (pelo link do QR Code) ou o portal nacional e copia a chave de 44 dígitos.',
 'Botão "Colar dados da nota": lê o texto copiado do site da SEFAZ e preenche data e hora de emissão, protocolo de autorização, número, série e total, com opção de importar os itens.',
 'Aviso quando a chave lida tem mês inválido ou dígito verificador incorreto.'
]},
{v:'2.0',d:'18/10/2026',i:[
 'Banco de dados na nuvem (Firebase, via fenix-core): login com e-mail e senha e sincronia em tempo real entre todos os seus aparelhos, com cache para uso sem internet.',
 'Compra em andamento compartilhada: itens e cronômetros aparecem em todos os aparelhos logados.',
 'Finalidade da compra (para casa, para venda, para veículo, para terceiros…) por compra e por item, com categorias flexíveis: crie, renomeie ou exclua à vontade.',
 'Recorrência por produto: marque o 🔁 e o app calcula de quantos em quantos dias você compra (ou use um intervalo manual).',
 'Lista de compras automática: produtos recorrentes entram sozinhos perto da data; "tirar da lista" suspende por alguns dias; itens manuais também.',
 'A lista aparece durante a compra, com atalho para jogar o item no carrinho; ao finalizar, os itens comprados saem da lista.',
 'Estatísticas de gasto por finalidade e filtro de notas por finalidade.',
 'Aviso de backup, tela Sobre (acessos e versões) e padronização de textos vindos do fenix-core.',
 'Importação automática dos dados da v1.0 que estavam neste aparelho.',
 'Modo PWA: manifest, ícones e service worker para instalar e abrir offline.'
]},
{v:'1.0',d:'18/10/2026',i:[
 'Primeira versão do Controle de Compras: carrinho em tempo real, leitura de códigos pela câmera, banco de produtos, notas em ordem cronológica, limite de gasto, quatro cronômetros, estatísticas e backup.'
]}];

/* ====== estado ====== */
let FC=null,authMod=null,dbFire=null,sinc=null,usuario=null,cancelar=[];
const nomesCol=['compras','produtos','estabs','lista','sessao','config'];
let carregado={},servidor={},migracaoChecada=false,lembreteFeito=false;
function configPadrao(){return{categorias:[{id:'casa',nome:'Para casa',recorrente:true},{id:'terceiros',nome:'Para terceiros',recorrente:false},{id:'veiculo',nome:'Para veículo',recorrente:false},{id:'venda',nome:'Para venda',recorrente:false}],limitePadrao:0,antecedencia:3,pularDias:7};}
function base(){return{produtos:{},compras:[],estabs:{},lista:[],sessao:null,config:configPadrao()};}
let db=base();

/* ====== utilidades ====== */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc=s=>encodeURIComponent(s).replace(/'/g,'%27');
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const p2=n=>String(n).padStart(2,'0');
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());};
const agora=()=>{const d=new Date();return p2(d.getHours())+':'+p2(d.getMinutes());};
const fmtData=iso=>{const a=String(iso||'').split('-');return a.length===3?a[2]+'/'+a[1]+'/'+a[0]:'';};
const fmtDM=iso=>{const a=String(iso||'').split('-');return a.length===3?a[2]+'/'+a[1]:'';};
const isoUTC=iso=>{const a=String(iso).split('-').map(Number);return Date.UTC(a[0],a[1]-1,a[2]);};
const diasEntre=(a,b)=>Math.round((isoUTC(b)-isoUTC(a))/864e5);
const somaDias=(iso,n)=>{const t=new Date(isoUTC(iso)+n*864e5);return t.getUTCFullYear()+'-'+p2(t.getUTCMonth()+1)+'-'+p2(t.getUTCDate());};
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const fmt=n=>BRL.format(Number(n)||0);
const fq=q=>String(+Number(q).toFixed(3)).replace('.',',');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const cmp=(a,b)=>String(a).localeCompare(String(b),'pt-BR',{sensitivity:'base'});
function hid(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);}
const pid=k=>'p'+hid(k);
function parseNum(s){s=String(s==null?'':s).trim();if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s);}
function fmtDur(ms){const t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return h?h+':'+p2(m)+':'+p2(s):p2(m)+':'+p2(s);}
function fmtMin(ms){const m=Math.round(ms/60000);return m<60?m+' min':Math.floor(m/60)+'h '+p2(m%60)+'min';}
const itemTotal=i=>i.totalItem>0?Math.round(i.totalItem*100)/100:Math.round(i.qtd*i.preco*100)/100;
/* grandezas: 'emb' = por embalagem (nº de embalagens × preço da embalagem, com o conteúdo de cada uma); 'peso' = por peso/volume (balança) */
const modoDe=i=>i.modo||(['kg','l','L'].includes(i.unidade)?'peso':'emb');
const UN_CONT=['g','kg','ml','L','un','m'];
const unBase=u=>u==='l'?'L':u;
function paraBase(v,u){if(u==='g')return{v:v/1000,u:'kg'};if(u==='ml')return{v:v/1000,u:'L'};return{v:v,u:unBase(u)};}
function precoBase(i){
 if(modoDe(i)==='peso')return i.preco>0?{valor:i.preco,un:unBase(i.unidade)}:null;
 if(i.conteudo&&i.conteudo.v>0&&i.preco>0){const b=paraBase(i.conteudo.v,i.conteudo.u);if(b.v>0)return{valor:i.preco/b.v,un:b.u};}
 return null;}
function fmtPeso(q,u){u=unBase(u);if(u==='kg'&&q<1)return fq(Math.round(q*1000))+' g';if(u==='L'&&q<1)return fq(Math.round(q*1000))+' ml';return fq(q)+' '+u;}
const txtConteudo=i=>i.conteudo&&i.conteudo.v>0?fq(i.conteudo.v)+' '+i.conteudo.u:'';
function descItem(i){
 if(modoDe(i)==='peso')return fmtPeso(i.qtd,i.unidade)+' × '+fmt(i.preco)+'/'+unBase(i.unidade);
 const c=txtConteudo(i),pb=precoBase(i);
 return fq(i.qtd)+' '+(i.unidade||'un')+(c?' de '+c:'')+' × '+fmt(i.preco)+(pb?' · '+fmt(pb.valor)+'/'+pb.un:'');}
const descProd=p=>modoDe(p)==='peso'?'por '+(unBase(p.unidade)==='L'?'litro':'quilo'):(txtConteudo(p)||'embalagem');
function pbTxt(p){if(modoDe(p)==='peso'||!(p.ultimoPreco>0))return '';const pb=precoBase({modo:'emb',conteudo:p.conteudo,preco:p.ultimoPreco});return pb?fmt(pb.valor)+'/'+pb.un:'';}
const somaItens=a=>Math.round((a||[]).reduce((s,i)=>s+itemTotal(i),0)*100)/100;
const chaveProd=i=>i.codigo?String(i.codigo):'nome:'+norm(i.nome).trim()+(modoDe(i)!=='peso'&&i.conteudo&&i.conteudo.v>0?'|'+i.conteudo.v+i.conteudo.u:'');
const totalCompra=c=>c.total>0?c.total:somaItens(c.itens);
const tit=s=>FC&&FC.formatarTitulo?FC.formatarTitulo(s):s;
const maius=s=>FC&&FC.formatarNomeMaiusculo?FC.formatarNomeMaiusculo(s):s;
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2800);}
function vibra(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}

/* ====== persistência na nuvem (por documento) ====== */
function erroNuvem(e){console.error(e);toast('Falha ao sincronizar ('+(e&&e.code?e.code:'erro')+')');}
function gravar(nome,obj){if(!sinc){toast('Sem conexão com a nuvem');return;}sinc.salvar(nome,obj).catch(erroNuvem);}
function apagarDoc(nome,id){if(!sinc)return;sinc.excluir(nome,id).catch(erroNuvem);}
function gravarCompra(c){gravar('compras',c);}
function gravarProduto(k){const p=db.produtos[k];if(!p)return;p.k=k;p.id=pid(k);gravar('produtos',p);}
function gravarSessao(){if(db.sessao)gravar('sessao',Object.assign({},db.sessao,{id:'atual'}));else apagarDoc('sessao','atual');}
function gravarConfig(){gravar('config',Object.assign({},db.config,{id:'geral'}));}
function salvarEstab(nome,cnpj,extra){const k=norm(nome);const ant=db.estabs[k]||{};const e=Object.assign({},ant,{id:'e'+hid(k),k,nome,cnpj:cnpj||ant.cnpj||''},extra||{});db.estabs[k]=e;gravar('estabs',e);}

function normSessao(d){d.itens=d.itens||[];d.timers=d.timers||novosTimers();TIMERS.forEach(t=>{const x=d.timers[t.k]||(d.timers[t.k]={seg:[],ini:null});x.seg=(x.seg||[]).map(s=>Array.isArray(s)?{a:s[0],b:s[1]}:s);if(x.ini===undefined)x.ini=null;});return d;}
function aplicar(nome,ms){ms.forEach(m=>{const d=m.dados,rem=m.tipo==='removed';
 if(nome==='compras'||nome==='lista'){const arr=db[nome],i=arr.findIndex(x=>x.id===m.id);if(rem){if(i>=0)arr.splice(i,1);}else{d.id=m.id;if(nome==='compras')d.itens=d.itens||[];if(i>=0)arr[i]=d;else arr.push(d);}}
 else if(nome==='produtos'){if(rem){for(const k in db.produtos)if(db.produtos[k].id===m.id)delete db.produtos[k];}else{d.id=m.id;d.historico=d.historico||[];db.produtos[d.k]=d;}}
 else if(nome==='estabs'){if(rem){for(const k in db.estabs)if(db.estabs[k].id===m.id)delete db.estabs[k];}else{d.id=m.id;db.estabs[d.k]=d;}}
 else if(nome==='sessao'){db.sessao=rem?null:normSessao(d);}
 else if(nome==='config'){if(!rem){const c=Object.assign(configPadrao(),d);delete c.id;db.config=c;}}
});}

/* ====== modais (só fecham pelo ✕ ou pelos botões) ====== */
let zc=1000;
function abrirModal(titulo,corpo,op){op=op||{};
 const ov=document.createElement('div');ov.className='ov';ov.style.zIndex=++zc;
 const md=document.createElement('div');md.className='md';
 const h=document.createElement('div');h.className='mh';h.innerHTML='<b>'+esc(titulo)+'</b><button class="x" aria-label="Fechar">✕</button>';
 const c=document.createElement('div');c.className='mb';
 if(typeof corpo==='string')c.innerHTML=corpo;else c.appendChild(corpo);
 md.appendChild(h);md.appendChild(c);ov.appendChild(md);document.body.appendChild(ov);
 let fechado=false;
 const api={el:c,fechar(){if(fechado)return;fechado=true;ov.remove();if(op.aoFechar)op.aoFechar();}};
 h.querySelector('.x').onclick=api.fechar;
 return api;}
function confirmar(msg,sim){return new Promise(res=>{let r=false;
 const m=abrirModal('Confirmar','<p style="margin-top:0">'+esc(msg)+'</p><div class="row"><button class="btn ghost" id="cN">Não</button><button class="btn danger" id="cS">'+esc(sim||'Sim')+'</button></div>',{aoFechar:()=>res(r)});
 m.el.querySelector('#cN').onclick=()=>m.fechar();
 m.el.querySelector('#cS').onclick=()=>{r=true;m.fechar();};});}

/* ====== leitor de código (câmera) ====== */
function scanner(titulo,aoLer){
 const sup='BarcodeDetector' in window;
 const m=abrirModal(titulo,'<div class="scanbox"><video playsinline muted></video><div class="mira"></div></div><p class="hint" id="scMsg">'+(sup?'Aponte a câmera para o código de barras ou QR Code.':'Este navegador não lê códigos pela câmera. Use o Chrome no Android, ou digite o código abaixo.')+'</p><label>Ou digite / cole o código<input id="scMan" autocomplete="off"></label><button class="btn gold" id="scOk">Usar este código</button>',{aoFechar:parar});
 const v=m.el.querySelector('video');let stream=null,tm=null,vivo=true,ocupado=false;
 function parar(){vivo=false;clearInterval(tm);if(stream)stream.getTracks().forEach(t=>t.stop());}
 function achou(txt){if(!vivo)return;vivo=false;vibra(60);m.fechar();aoLer(String(txt).trim());}
 m.el.querySelector('#scOk').onclick=()=>{const t=m.el.querySelector('#scMan').value.trim();if(!t){toast('Digite o código');return;}achou(t);};
 if(!sup)return;
 (async()=>{try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false});
  if(!vivo){stream.getTracks().forEach(t=>t.stop());return;}
  v.srcObject=stream;await v.play();
  let det;try{det=new BarcodeDetector({formats:['qr_code','ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf']});}catch(e){det=new BarcodeDetector();}
  tm=setInterval(async()=>{if(!vivo||ocupado||v.readyState<2)return;ocupado=true;

/* ====== chave de acesso da NF-e / NFC-e ====== */
const UFS={11:'RO',12:'AC',13:'AM',14:'RR',15:'PA',16:'AP',17:'TO',21:'MA',22:'PI',23:'CE',24:'RN',25:'PB',26:'PE',27:'AL',28:'SE',29:'BA',31:'MG',32:'ES',33:'RJ',35:'SP',41:'PR',42:'SC',43:'RS',50:'MS',51:'MT',52:'GO',53:'DF'};
function dvOk(ch){let pe=2,s=0;for(let i=42;i>=0;i--){s+=+ch[i]*pe;pe=pe===9?2:pe+1;}const r=s%11;const dv=r<2?0:11-r;return dv===+ch[43];}
function lerChave(txt){const m=String(txt).replace(/\s/g,'').match(/\d{44}/);if(!m)return null;const ch=m[0];
 return{chave:ch,uf:UFS[+ch.slice(0,2)]||'',aamm:ch.slice(2,6),cnpj:ch.slice(6,20),modelo:ch.slice(20,22),serie:String(+ch.slice(22,25)),numero:String(+ch.slice(25,34)),dv:dvOk(ch),mesOk:+ch.slice(4,6)>=1&&+ch.slice(4,6)<=12};}
function fmtCnpj(c){c=String(c||'').replace(/\D/g,'');return c.length===14?c.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,'$1.$2.$3/$4-$5'):c;}

const TIMERS=[
 {k:'casa',nome:'🏠 Saída de casa → Retorno',ini:'Saí de casa',fim:'Voltei'},
 {k:'loja',nome:'🏬 No estabelecimento',ini:'Cheguei',fim:'Saí'},
 {k:'caixa',nome:'💳 No caixa',ini:'Cheguei no caixa',fim:'Finalizei'},
 {k:'fila',nome:'🧍 Fila (açougue, padaria…)',ini:'Entrei na fila',fim:'Saí da fila'}];
const novosTimers=()=>{const o={};TIMERS.forEach(t=>o[t.k]={seg:[],ini:null});return o;};
const tTotal=t=>t.seg.reduce((a,s)=>a+(s.b-s.a),0)+(t.ini?Date.now()-t.ini:0);
function temposDe(s){const o={},now=Date.now();TIMERS.forEach(d=>{const t=s.timers[d.k];if(t.ini){t.seg.push({a:t.ini,b:now});t.ini=null;}o[d.k]=tTotal(t);o[d.k+'N']=t.seg.length;});o.inicio=s.criadoEm;return o;}
setInterval(()=>{document.querySelectorAll('[data-t]').forEach(e=>{const t=db.sessao&&db.sessao.timers[e.dataset.t];if(t)e.textContent=fmtDur(tTotal(t));});},1000);

/* ====== ajuste manual dos cronômetros ====== */
const horaDe=ts=>{const d=new Date(ts);return p2(d.getHours())+':'+p2(d.getMinutes());};
const tsDe=(hhmm,ref)=>{const a=String(hhmm).split(':').map(Number);const d=new Date(ref||Date.now());d.setHours(a[0],a[1],0,0);return d.getTime();};
function ajustarTimer(k){
 const s=db.sessao;if(!s)return;
 const def=TIMERS.find(x=>x.k===k),t=s.timers[k];
 const linhas=t.seg.map(x=>({a:x.a,b:x.b}));if(t.ini)linhas.push({a:t.ini,b:null});
 const m=abrirModal('Ajustar: '+def.nome,'<p class="hint" style="margin-top:0">Corrija os horários quando esquecer de tocar no botão na hora. Deixe o "fim" vazio se o cronômetro ainda está correndo.</p><div id="aj_l"></div><div class="hint">Começou há…</div><div class="row" id="aj_q"></div><button class="btn ghost" id="aj_add">＋ Adicionar trecho</button><button class="btn gold big" id="aj_ok">Salvar</button>');
 const g=id=>m.el.querySelector('#'+id);
 function desenhar(){
  g('aj_l').innerHTML=linhas.length?linhas.map((l,ix)=>'<div class="it"><div class="nm"><div class="grid2"><label>Início<input type="time" data-a="'+ix+'" value="'+horaDe(l.a)+'"></label><label>Fim<input type="time" data-b="'+ix+'" value="'+(l.b?horaDe(l.b):'')+'"></label></div><small>'+(l.b?'duração '+fmtDur(l.b-l.a):'em andamento')+'</small></div><button class="ic r" data-x="'+ix+'">✕</button></div>').join(''):'<div class="hint">Nenhum registro neste cronômetro.</div>';
  g('aj_l').querySelectorAll('[data-a]').forEach(i=>i.onchange=()=>{if(i.value){const l=linhas[+i.dataset.a];l.a=tsDe(i.value,l.a);}desenhar();});
  g('aj_l').querySelectorAll('[data-b]').forEach(i=>i.onchange=()=>{const l=linhas[+i.dataset.b];l.b=i.value?tsDe(i.value,l.a):null;desenhar();});
  g('aj_l').querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{if(await confirmar('Tem certeza que quer excluir este trecho?','Excluir')){linhas.splice(+b.dataset.x,1);desenhar();}});}
 desenhar();
 g('aj_q').innerHTML=[5,10,15,30,60].map(n=>'<button class="btn ghost sm" data-q="'+n+'">'+n+' min</button>').join('');
 g('aj_q').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const ts=Date.now()-(+b.dataset.q)*60000;const r=linhas.find(l=>!l.b);if(r)r.a=ts;else linhas.push({a:ts,b:null});desenhar();});
 g('aj_add').onclick=()=>{const n=Date.now();linhas.push({a:n-5*60000,b:n});desenhar();};
 g('aj_ok').onclick=()=>{
  const abertas=linhas.filter(l=>!l.b);if(abertas.length>1){toast('Só um trecho pode estar em andamento (sem hora de fim).');return;}
  if(linhas.some(l=>l.b&&l.b<l.a)){toast('O fim não pode ser antes do início.');return;}
  const x=db.sessao;if(!x){m.fechar();return;}
  const tt=x.timers[k];tt.seg=linhas.filter(l=>l.b).sort((p,q)=>p.a-q.a).map(l=>({a:l.a,b:l.b}));tt.ini=abertas.length?abertas[0].a:null;
  gravarSessao();m.fechar();render();toast('Cronômetro ajustado');};
}

/* ====== recorrência ====== */
function datasProd(p){return Array.from(new Set((p.historico||[]).map(h=>h.d).filter(Boolean))).sort();}
function intervaloAuto(p){const ds=datasProd(p);if(ds.length<2)return 0;const dif=[];for(let i=1;i<ds.length;i++){const d=diasEntre(ds[i-1],ds[i]);if(d>0)dif.push(d);}const u=dif.slice(-5);return u.length?Math.max(1,Math.round(u.reduce((a,b)=>a+b,0)/u.length)):0;}
const intervalo=p=>p.intervaloManual>0?p.intervaloManual:intervaloAuto(p);
const ultimaData=p=>{const ds=datasProd(p);return ds.length?ds[ds.length-1]:'';};
const textoPrazo=f=>f<0?'atrasado '+(-f)+' dia(s)':f===0?'é hoje':'em '+f+' dia(s)';
function sugeridos(){const h=hoje(),ant=db.config.antecedencia;const out=[];
 Object.values(db.produtos).forEach(p=>{if(!p.recorrente)return;if(p.puladoAte&&h<p.puladoAte)return;const iv=intervalo(p),ult=ultimaData(p);if(!(iv>0)||!ult)return;const prox=somaDias(ult,iv);const falta=diasEntre(h,prox);if(falta<=ant)out.push({p,iv,ult,prox,falta});});
 return out.sort((a,b)=>cmp(a.p.nome,b.p.nome));}
function pulados(){const h=hoje();return Object.values(db.produtos).filter(p=>p.recorrente&&p.puladoAte&&h<p.puladoAte).sort((a,b)=>cmp(a.nome,b.nome));}
const casa=(l,it)=>(l.k&&l.k===chaveProd(it))||norm(l.nome)===norm(it.nome);
function pendentes(){const s=db.sessao,out=[];
 sugeridos().forEach(o=>{if(!(s&&s.itens.some(x=>chaveProd(x)===o.p.k)))out.push({ref:'a:'+o.p.id,nome:o.p.nome,info:'🔁 '+textoPrazo(o.falta)});});
 db.lista.forEach(l=>{if(!(s&&s.itens.some(x=>casa(l,x))))out.push({ref:'m:'+l.id,nome:l.nome,info:l.qtd?fq(l.qtd)+' '+(l.unidade||''):''});});
 return out.sort((a,b)=>cmp(a.nome,b.nome));}

function numBR(s){const n=parseNum(String(s));return isNaN(n)?0:n;}
function lerTextoNota(raw){
 const t=String(raw||'').replace(/ /g,' ');
 const flat=t.replace(/\s+/g,' ');
 const out={emissao:null,protocolo:'',numero:'',serie:'',total:0,cnpj:'',chave:'',itens:[]};
 let m=flat.match(/Emiss[aã]o:?\s*(\d{2})\/(\d{2})\/(\d{4})\D{0,6}(\d{2}):(\d{2})/i)||flat.match(/(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2}):\d{2}/);
 if(m)out.emissao={data:m[3]+'-'+m[2]+'-'+m[1],hora:m[4]+':'+m[5]};
 m=flat.match(/Protocolo(?: de Autoriza[cç][aã]o)?:?\s*(\d{12,20})/i);if(m)out.protocolo=m[1];
 m=flat.match(/N[úu]mero:?\s*(\d{1,9})\s*S[ée]rie:?\s*(\d{1,3})/i);if(m){out.numero=String(+m[1]);out.serie=String(+m[2]);}
 m=flat.match(/Valor\s*a\s*pagar\s*(?:R\$)?:?\s*(\d{1,3}(?:\.\d{3})*,\d{2})/i)||flat.match(/Valor\s*total(?:\s*da\s*nota)?\s*(?:R\$)?:?\s*(\d{1,3}(?:\.\d{3})*,\d{2})/i);if(m)out.total=numBR(m[1]);
 m=flat.match(/CNPJ:?\s*(\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2})/i);if(m)out.cnpj=m[1].replace(/\D/g,'');
 m=flat.match(/(?:\d{4} ){10}\d{4}/)||flat.match(/\d{44}/);if(m)out.chave=m[0].replace(/\D/g,'');
 const ok=(q,p,tt)=>q>0&&p>0&&(!(tt>0)||Math.abs(q*p-tt)<=Math.max(0.03,tt*0.005));
 const re=/C[oó]digo:?\s*(\d+)\s*\)?\s*Qtde\.?:?\s*([\d.,]+)\s*UN:?\s*([A-Za-z]{1,4})\s*Vl\.?\s*Unit\.?:?\s*([\d.,]+)\s*Vl\.?\s*Total:?\s*([\d.,]+)/gi;
 let prev=0,mm;
 while((mm=re.exec(flat))){
  let nome=flat.slice(prev,mm.index).replace(/\(\s*$/,'');
  nome=nome.replace(/^.*(?:Vl\.?\s*Total:?\s*[\d.,]+|CNPJ:?\s*[\d.\/-]{14,18}|Descri[cç][aã]o|DANFE[^A-Za-z]*|Consumidor)\s*/i,'').replace(/^[\s:)\-–]+/,'').trim();
  if(nome.length>80)nome=nome.slice(-80).trim();
  const q=numBR(mm[2]),p=numBR(mm[4]),tt=numBR(mm[5]);prev=re.lastIndex;
  if(nome&&ok(q,p,tt))out.itens.push({codigo:mm[1],nome,qtd:q,un:mm[3].toUpperCase(),preco:p,total:tt});}
 if(!out.itens.length){
  const reB=/^\s*(?:\d{1,3}[ \t]+)?(?:(\d{4,14})[ \t]+)?([^\t\n]{3,80}?)[\t ]+([\d.,]+)[\t ]+(UN|KG|G|L|ML|PC|PCT|CX|LT|UNID|MT)[\t ]+([\d.,]+)[\t ]+([\d.,]+)\s*$/gim;
  while((mm=reB.exec(t))){const q=numBR(mm[3]),p=numBR(mm[5]),tt=numBR(mm[6]);if(ok(q,p,tt))out.itens.push({codigo:mm[1]||'',nome:mm[2].trim(),qtd:q,un:mm[4].toUpperCase(),preco:p,total:tt});}}
 return out;}

/* ====== aba Números (estatísticas) ====== */
function viewStats(){
 const cs=db.compras;if(!cs.length)return '<div class="empty">As estatísticas aparecem depois da primeira compra salva.</div>';
 const dias=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];const pd=[0,0,0,0,0,0,0];
 const hs={};const med={casa:[],loja:[],caixa:[],fila:[]};const est={};const fin={};
 cs.forEach(c=>{const d=new Date(c.data+'T12:00:00').getDay();pd[d]++;
  const h=parseInt((c.hora||'').slice(0,2),10);
  if(!isNaN(h)){hs[h]=hs[h]||{n:0,esp:[]};hs[h].n++;if(c.tempos)hs[h].esp.push((c.tempos.fila||0)+(c.tempos.caixa||0));}
  if(c.tempos)Object.keys(med).forEach(k=>{if(c.tempos[k]>0)med[k].push(c.tempos[k]);});
  const e=c.estab||'(sem nome)';est[e]=est[e]||{n:0,v:0};est[e].n++;est[e].v+=totalCompra(c);
  if(c.itens.length)c.itens.forEach(i=>{const n=catNome(i.cat||c.cat)||'Sem finalidade';fin[n]=(fin[n]||0)+itemTotal(i);});else{const n=catNome(c.cat)||'Sem finalidade';fin[n]=(fin[n]||0)+totalCompra(c);}});
 const mx=Math.max.apply(null,pd)||1;
 const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
 let melhor='';const hk=Object.keys(hs).filter(h=>hs[h].esp.length);
 if(hk.length>1){const b=hk.map(h=>({h:+h,m:avg(hs[h].esp)})).sort((a,b)=>a.m-b.m)[0];melhor='<p class="hint">⭐ Menor espera (fila + caixa) até agora: por volta das <b>'+p2(b.h)+'h</b> (média de '+fmtMin(b.m)+').</p>';}
 const hmx=Math.max.apply(null,Object.values(hs).map(x=>x.n))||1;
 const fmx=Math.max.apply(null,Object.values(fin))||1;
 const total=cs.reduce((s,c)=>s+totalCompra(c),0);
 return '<div class="card"><h2>Resumo</h2><div class="kv"><span>Compras registradas</span><span>'+cs.length+'</span></div><div class="kv"><span>Total gasto</span><span><b>'+fmt(total)+'</b></span></div><div class="kv"><span>Ticket médio</span><span>'+fmt(total/cs.length)+'</span></div></div>'
 +'<div class="card"><h2>Gasto por finalidade</h2>'+Object.entries(fin).sort((a,b)=>b[1]-a[1]).map(([n,v])=>'<div class="bar w"><span>'+esc(n)+'</span><i style="width:'+(v/fmx*100)+'%"></i><b>'+fmt(v)+'</b></div>').join('')+'</div>'
 +'<div class="card"><h2>Dia da semana</h2>'+dias.map((n,i)=>'<div class="bar"><span>'+n+'</span><i style="width:'+(pd[i]/mx*100)+'%"></i><b>'+pd[i]+'×</b></div>').join('')+'</div>'
 +'<div class="card"><h2>Horário das compras</h2>'+Object.keys(hs).sort((a,b)=>a-b).map(h=>'<div class="bar"><span>'+p2(h)+'h</span><i style="width:'+(hs[h].n/hmx*100)+'%"></i><b>'+hs[h].n+'×</b></div>').join('')+melhor+'</div>'
 +'<div class="card"><h2>Tempos médios</h2>'+TIMERS.map(d=>'<div class="kv"><span>'+d.nome+'</span><span>'+(med[d.k].length?fmtMin(avg(med[d.k])):'—')+'</span></div>').join('')+'</div>'
 +'<div class="card"><h2>Por estabelecimento</h2>'+Object.entries(est).sort((a,b)=>b[1].v-a[1].v).map(([n,o])=>'<div class="kv"><span>'+esc(n)+' ('+o.n+'×)</span><span>'+fmt(o.v)+'</span></div>').join('')+'</div>';
}

 +'<div class="card"><h2>Dados</h2><button class="btn ghost" onclick="app.exportar()">⬇️ Exportar backup</button><button class="btn ghost" onclick="document.getElementById(\'imp\').click()">⬆️ Importar backup</button><input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="app.importar(this)"><button class="btn danger" onclick="app.apagarTudo()">Apagar todos os dados</button></div>'

/* ====== exportar / importar / migrar ====== */
function dadosBackup(){return{app:NOME_APP,versao:VERSAO,compras:db.compras,produtos:db.produtos,estabs:db.estabs,lista:db.lista,config:db.config,sessao:db.sessao};}
async function enviarParaNuvem(d){
 const prods=Object.entries(d.produtos||{}).map(([k,p])=>Object.assign({},p,{k:p.k||k,id:pid(p.k||k),historico:p.historico||[]}));
 const comp=(d.compras||[]).map(c=>Object.assign({},c,{id:c.id||uid(),itens:c.itens||[]}));
 const ests=Object.entries(d.estabs||{}).map(([k,e])=>({id:'e'+hid(e.k||k),k:e.k||k,nome:e.nome||k,cnpj:e.cnpj||''}));
 const lst=(d.lista||[]).map(l=>Object.assign({},l,{id:l.id||uid()}));
 if(prods.length)await sinc.salvarVarios('produtos',prods);
 if(comp.length)await sinc.salvarVarios('compras',comp);
 if(ests.length)await sinc.salvarVarios('estabs',ests);
 if(lst.length)await sinc.salvarVarios('lista',lst);
 if(d.config){const c=Object.assign(configPadrao(),d.config);if(!Array.isArray(c.categorias)||!c.categorias.length)c.categorias=configPadrao().categorias;db.config=c;gravarConfig();}
 if(d.sessao&&!db.sessao){const s=normSessao(Object.assign({},d.sessao));delete s.id;db.sessao=s;gravarSessao();}
}
function checarMigracao(){
 if(migracaoChecada||!sinc||!usuario)return;
 if(!(servidor.compras&&servidor.produtos&&todosCarregados()))return;
 migracaoChecada=true;
 if(db.compras.length||Object.keys(db.produtos).length)return;
 let v1=null;try{v1=JSON.parse(localStorage.getItem(CHAVE_V1));}catch(e){}
 try{if(localStorage.getItem(CHAVE_V1+'_migrado_'+usuario.uid))return;}catch(e){}
 if(!v1||(!(v1.compras||[]).length&&!Object.keys(v1.produtos||{}).length&&!v1.sessao))return;
 const m=abrirModal('Dados da versão 1.0','<p style="margin-top:0">Encontrei dados salvos <b>neste aparelho</b> pela versão 1.0: '+(v1.compras||[]).length+' compra(s) e '+Object.keys(v1.produtos||{}).length+' produto(s). Quer enviá-los para a nuvem?</p><button class="btn gold big" id="mg_ok">Enviar para a nuvem</button><button class="btn ghost" id="mg_no">Agora não</button>');
 m.el.querySelector('#mg_no').onclick=()=>m.fechar();
 m.el.querySelector('#mg_ok').onclick=async()=>{toast('Enviando…');m.fechar();try{await enviarParaNuvem(v1);try{localStorage.setItem(CHAVE_V1+'_migrado_'+usuario.uid,'1');}catch(e){}toast('Dados da v1.0 enviados ✔');}catch(e){erroNuvem(e);}};
}

const MSG_AUTH={'auth/invalid-credential':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.','auth/user-not-found':'E-mail ou senha incorretos.','auth/invalid-email':'E-mail inválido.','auth/email-already-in-use':'Este e-mail já tem conta. Use "Entrar".','auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.','auth/network-request-failed':'Sem internet para entrar.','auth/too-many-requests':'Muitas tentativas. Aguarde um pouco.','auth/missing-password':'Informe a senha.'};

 editarSessao(){
  const m=abrirModal('Dados da compra',dlEstab()+'<label>Estabelecimento<input id="s_est" list="dlEstab"></label><label>Finalidade<select id="s_cat"></select></label><label>Limite de gasto (R$)<input id="s_lim" inputmode="decimal"></label><button class="btn gold big" id="s_ok">Salvar</button>');
  const g=id=>m.el.querySelector('#'+id),s=db.sessao;g('s_est').value=s.estab||'';g('s_lim').value=s.limite?String(s.limite).replace('.',','):'';g('s_cat').innerHTML=opcoesCat();g('s_cat').value=s.cat||'';ligarCat(g('s_cat'));
  g('s_ok').onclick=()=>{const l=parseNum(g('s_lim').value),est=maius(g('s_est').value.trim());const x=db.sessao;if(!x){m.fechar();return;}x.estab=est;x.cat=g('s_cat').value;x.limite=l>0?l:0;if(est)salvarEstab(est);gravarSessao();m.fechar();render();};},
 async cancelarSessao(){if(await confirmar('Tem certeza que quer cancelar esta compra? Os itens lançados serão perdidos.','Cancelar compra')){db.sessao=null;gravarSessao();render();}},
 ajustarTimer(k){ajustarTimer(k);},

 escanearProduto(){scanner('Escanear produto',cod=>{itemModal(baseItem(cod,db.produtos[cod],db.sessao&&db.sessao.cat),n=>app.addItem(n),'Novo item');});},

 async addItem(it){const s=db.sessao;if(!s){toast('A compra foi encerrada em outro aparelho.');return;}const lim=s.limite||0,novo=somaItens(s.itens)+itemTotal(it);
  if(lim&&novo>lim){vibra([120,60,120]);if(!await confirmar('Este item faz a compra passar do limite em '+fmt(novo-lim)+'. Adicionar mesmo assim?','Adicionar'))return;}
  const x=db.sessao;if(!x)return;
  const ex=modoDe(it)==='peso'?null:x.itens.find(i=>modoDe(i)!=='peso'&&chaveProd(i)===chaveProd(it)&&i.preco===it.preco&&!!i.promo===!!it.promo&&i.unidade===it.unidade);

 async passo(ix,d){const s=db.sessao,i=s.itens[ix];const n=i.qtd+d;if(n<=0){app.removerItem(ix);return;}
  if(d>0&&s.limite&&somaItens(s.itens)+i.preco>s.limite){vibra([120,60,120]);if(!await confirmar('Mais uma unidade passa do limite. Adicionar mesmo assim?','Adicionar'))return;}

  else{const l=db.lista.find(x=>x.id===ref.slice(2));if(!l)return;const p=db.produtos[l.k||chaveProd({codigo:l.codigo,nome:l.nome})];it=baseItem(l.codigo||(p&&p.codigo)||'',p,l.cat||s.cat);it.nome=l.nome;it.qtd=l.qtd||1;if(l.unidade==='kg'||l.unidade==='L'){it.modo='peso';it.unidade=l.unidade;}if(l.cat)it.cat=l.cat;}

 limitePadrao(v){const n=parseNum(v);db.config.limitePadrao=n>0?n:0;gravarConfig();toast('Limite padrão salvo');},
 exportar(){if(FC)FC.backup.baixarJSON(NOME_APP,dadosBackup());},
 importar(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.compras))throw 0;

window.app=app;

/* ====== entrada / saída da conta ====== */
function entrou(u){
 usuario=u;sinc=FC.criarModuloSincronia(dbFire,u.uid,NOME_APP);
 db=base();carregado={};servidor={};migracaoChecada=false;lembreteFeito=false;
 sinc.medirRelogio().catch(()=>{});
 render();
 nomesCol.forEach(n=>{cancelar.push(sinc.ouvir(n,(ms,meta)=>{aplicar(n,ms);carregado[n]=true;if(!meta.doCache)servidor[n]=true;estadoSync(meta);agendarRender();checarMigracao();
   if(!lembreteFeito&&todosCarregados()){lembreteFeito=true;try{FC.backup.verificarLembrete(NOME_APP,{aoFazerBackup:()=>app.exportar()});}catch(e){}}},
  e=>{console.error(e);toast('Erro ao ler '+n+' ('+(e.code||'')+'). Confira as regras do Firestore.');carregado[n]=true;agendarRender();}));});
}
function saiu(){cancelar.forEach(f=>{try{f();}catch(e){}});cancelar=[];usuario=null;sinc=null;db=base();carregado={};telaLogin();}

async function boot(){
 const main=document.getElementById('main');
 if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
 try{const mod=await import(CORE_URL);FC=mod.FenixCore;}
 catch(e){main.innerHTML='<div class="card center"><h2>Não consegui carregar o fenix-core</h2><p class="hint">Verifique a internet e tente de novo.</p><button class="btn gold" onclick="location.reload()">Tentar novamente</button></div>';return;}
 try{
  const r=FC.initFirebaseComCache();FC.init(NOME_APP);dbFire=r.db;authMod=FC.criarModuloAuth(r.app);
  FC.sobre.registrarAcesso(NOME_APP,'v'+VERSAO);
  authMod.aoMudarEstado(u=>{if(u)entrou(u);else saiu();});
 }catch(e){console.error(e);main.innerHTML='<div class="card center"><h2>Erro ao iniciar</h2><p class="hint">'+esc(e.message||e)+'</p></div>';}
}
boot();
